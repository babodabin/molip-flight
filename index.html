<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="몰입 비행">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>몰입 비행</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
<style>
/* Layout: full-bleed map; floating round controls; one bottom sheet per step; full-screen overlays for ticket, window and arrival */
:root{
  --ink:#0b0b0c; --sheet:rgba(18,18,20,.82); --sheet-solid:#141416; --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.18);
  --fg:#f5f5f7; --muted:#9a9aa1; --dim:#6b6b72;
  --yellow:#ffd60a; --visited:#ff9f43; --sky:#64d2ff; --green:#30d158; --red:#ff6b5a;
  --f:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px); --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#000;color:var(--fg);font-family:var(--f);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
#space{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 40%,#0b1530 0%,#05070d 55%,#000 100%)}
#space::after{content:"";position:absolute;inset:0;opacity:.55;background-image:radial-gradient(1px 1px at 12% 22%,#fff,transparent),radial-gradient(1px 1px at 72% 12%,#fff,transparent),radial-gradient(1px 1px at 33% 78%,#cfe,transparent),radial-gradient(1px 1px at 88% 64%,#fff,transparent),radial-gradient(1px 1px at 52% 44%,#fff,transparent),radial-gradient(1px 1px at 18% 58%,#fff,transparent),radial-gradient(1px 1px at 64% 86%,#fff,transparent),radial-gradient(1px 1px at 92% 32%,#fff,transparent);background-size:340px 340px}
#map{position:fixed;inset:0}
.maplibregl-ctrl-attrib{font-size:9px!important;background:rgba(0,0,0,.35)!important;color:#bbb!important}
.maplibregl-ctrl-attrib a{color:#ccc!important}
.maplibregl-ctrl-bottom-right{bottom:calc(var(--sb) + var(--attrib-lift,0px))!important}

/* round controls */
.rbtn{all:unset;cursor:pointer;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--sheet);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);color:var(--fg)}
.rbtn svg{width:20px;height:20px}
.rbtn[aria-pressed="true"]{background:rgba(255,214,10,.22);border-color:rgba(255,214,10,.5);color:var(--yellow)}
.rbtn.hot{background:rgba(255,159,67,.28);border-color:rgba(255,159,67,.6);color:#ffb26b}
.col{position:fixed;display:flex;flex-direction:column;gap:10px;z-index:6}
.col.l{left:calc(16px + var(--sl));top:calc(14px + var(--st))}
.col.r{right:calc(16px + var(--sr));top:calc(14px + var(--st))}

/* sheets */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:0 calc(12px + var(--sr)) calc(12px + var(--sb)) calc(12px + var(--sl))}
.sheet>.in{max-width:520px;margin:0 auto;background:var(--sheet);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1px solid var(--line);border-radius:26px;padding:18px;display:grid;gap:14px;max-height:56vh;overflow:auto}
#select .alist{max-height:22vh;overflow:auto}
.pill{all:unset;cursor:pointer;text-align:center;padding:15px 18px;border-radius:999px;font-weight:600;font-size:16px;background:#fff;color:#000}
.pill.dark{background:rgba(255,255,255,.1);color:var(--fg)}
.pill[disabled]{opacity:.35;cursor:not-allowed}
.pill.sm{padding:10px 14px;font-size:14px}
.lbl{font-size:12px;color:var(--muted)}
.mono{font-family:var(--mono)}
.row{display:flex;gap:10px;align-items:center}
.sp{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ghost{all:unset;cursor:pointer;font-size:14px;color:var(--muted);padding:6px 4px}
h1,h2{margin:0;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:19px}

/* home */
.greet{position:fixed;left:calc(20px + var(--sl));right:80px;top:calc(18px + var(--st));z-index:4;pointer-events:none}
.greet h1{font-size:30px;text-shadow:0 2px 18px rgba(0,0,0,.6)}
.greet p{margin:6px 0 0;font-size:15px;color:#d8d8de;text-shadow:0 1px 10px rgba(0,0,0,.8)}
.greet b{color:var(--yellow);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:rgba(255,255,255,.05);border-radius:16px;padding:10px 12px}
.stats b{display:block;font-family:var(--mono);font-size:19px;font-weight:500;margin-top:2px;white-space:nowrap}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}

/* time select */
.tbig{font-family:var(--mono);font-size:40px;font-weight:500;letter-spacing:-.03em}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:rgba(255,255,255,.16)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;margin-top:-11px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:rgba(255,255,255,.16)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:0}
.ticks{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:-4px}
.search{all:unset;width:100%;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.07);font-size:15px}
.alist{display:grid;gap:2px}
.arow{all:unset;cursor:pointer;display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:10px;padding:12px 10px;border-radius:14px}
.arow:hover{background:rgba(255,255,255,.05)}
.arow[aria-pressed="true"]{background:rgba(255,214,10,.14)}
.arow[disabled]{opacity:.35;cursor:not-allowed}
.arow b{font-family:var(--mono);font-size:18px;font-weight:700}
.arow span{font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow span em{font-style:normal;font-size:11px;color:var(--visited);margin-left:6px}
.arow i{font-style:normal;font-family:var(--mono);font-size:14px;color:var(--muted)}

/* airport markers */
.apm{display:flex;align-items:center;gap:5px;padding:4px 7px 4px 6px;border-radius:7px;background:#000;border:2px solid var(--yellow);color:#fff;font-family:var(--mono);font-size:11px;font-weight:700;box-shadow:0 3px 10px rgba(0,0,0,.5)}
.apm svg{width:14px;height:14px;fill:var(--yellow)}

/* full-screen layers */
.full{position:fixed;inset:0;z-index:8}

/* seat */
#seatView{background:#0a0a0b;overflow:auto;padding:calc(64px + var(--st)) 16px calc(120px + var(--sb))}
.fuse{position:relative;width:min(340px,92vw);margin:0 auto;padding:150px 26px 40px;border-radius:170px 170px 40px 40px;background:linear-gradient(#1c1c1f,#161618);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.fuse::before{content:"";position:absolute;left:50%;top:58px;width:58%;height:46px;transform:translateX(-50%);border-radius:60px 60px 6px 6px;background:linear-gradient(90deg,#2b2b30 0 47%,transparent 47% 53%,#2b2b30 53%);opacity:.9}
.srow{display:grid;grid-template-columns:1fr 1fr 42px 1fr 1fr;gap:9px;align-items:center;margin-bottom:9px}
.srow .rn{font-family:var(--mono);font-size:13px;color:var(--dim);text-align:center}
.srow .ch{font-family:var(--mono);font-size:12px;color:var(--dim);text-align:center}
.seat{all:unset;cursor:pointer;aspect-ratio:1;border-radius:12px;background:#232327;display:grid;place-items:center;transition:transform .12s}
.seat:active{transform:scale(.94)}
.seat[disabled]{background:repeating-linear-gradient(135deg,#121214 0 5px,#19191c 5px 10px);cursor:not-allowed}
.seat svg{width:46%;height:46%}
.seat.sel{box-shadow:0 0 0 2px #fff inset}
.focuscard{position:fixed;left:50%;top:calc(50% - 30px);transform:translate(-50%,-50%);width:min(340px,90vw);z-index:9;background:rgba(40,40,44,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:20px;padding:14px;display:grid;gap:10px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{all:unset;cursor:pointer;display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:999px;font-size:14px;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);color:var(--c);background:color-mix(in srgb,var(--c) 10%,transparent)}
.chip svg{width:16px;height:16px}
.chip[aria-pressed="true"]{background:var(--c);color:#000}
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:9;padding:16px calc(16px + var(--sr)) calc(16px + var(--sb)) calc(16px + var(--sl));background:linear-gradient(transparent,rgba(0,0,0,.85) 40%);display:grid}
.bottombar .pill{max-width:520px;width:100%;margin:0 auto;box-sizing:border-box}

/* ticket */
#ticketView{pointer-events:none}
#ticketView>*{pointer-events:auto}
.ticketWrap{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(16px + var(--sb));display:grid;gap:14px;justify-items:center}
.ticket{width:min(380px,100%);position:relative;filter:drop-shadow(0 18px 40px rgba(0,0,0,.6))}
.tmain,.tstub{background:#1c1c1e;color:#fff;position:relative}
.tmain{border-radius:20px 20px 0 0;padding:20px 20px 16px;overflow:hidden}
.tmain canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.5;pointer-events:none}
.tmain>*{position:relative}
.tcodes{display:flex;justify-content:space-between;align-items:center}
.tcodes b{font-family:var(--mono);font-size:44px;font-weight:500;letter-spacing:-.02em;line-height:1}
.tcodes svg{width:18px;height:18px;fill:#8e8e93}
.tsub{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px;gap:8px}
.tfields{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px;margin-top:22px}
.tfields div:nth-child(even){text-align:right}
.tfields small{display:block;font-size:11px;color:var(--muted)}
.tfields b{font-family:var(--mono);font-size:14px;font-weight:500}
.tstub{border-radius:0 0 20px 20px;padding:18px 20px 20px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;transform-origin:100% 0;margin-top:-10px;padding-top:28px}
.tstub::before{content:"";position:absolute;left:18px;right:18px;top:12px;border-top:2px dashed rgba(255,255,255,.22)}
.notch{position:absolute;width:22px;height:22px;border-radius:50%;background:transparent;box-shadow:0 0 0 400px transparent}
.tstub canvas{display:block;width:100%;height:58px;border-radius:4px;background:#fff}
.tstubhint{font-size:12px;color:var(--muted);text-align:center;margin-top:10px}
.ticket.recoil{animation:recoil .35s ease-out}
@keyframes recoil{30%{transform:translateY(-6px) rotate(-.8deg)}70%{transform:translateY(2px) rotate(.3deg)}}

/* ready */
#readyView{background:radial-gradient(ellipse at 50% 40%,rgba(235,244,255,.84),rgba(250,250,252,.95) 70%);color:#111;display:grid;place-items:center;text-align:center}
#readyView .rv{display:grid;gap:26px;justify-items:center;padding:20px}
#readyView svg{width:38px;height:38px}
#readyView h1{font-size:24px;line-height:1.35;font-weight:600}
#readyView .pill{background:#000;color:#fff;padding:13px 34px}

/* captions */
.caption{position:fixed;left:50%;top:calc(70px + var(--st));transform:translateX(-50%);z-index:7;width:min(460px,86vw);text-align:center;font-size:15px;line-height:1.55;padding:10px 14px;border-radius:16px;background:rgba(0,0,0,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:opacity .5s}
.caption small{display:block;font-size:10px;letter-spacing:.18em;color:var(--yellow);margin-bottom:4px}

/* flight HUD */
.hudb{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:60px calc(20px + var(--sr)) calc(18px + var(--sb)) calc(20px + var(--sl));background:linear-gradient(transparent,rgba(0,0,0,.7));display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
.hudb small{display:block;font-size:12px;color:#c7c7cc}
.hudb b{font-family:var(--f);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hudb b u{text-decoration:none;font-size:17px;font-weight:500;color:#c7c7cc;margin-left:4px}
.hudb .r{text-align:right}
.hudmid{position:fixed;left:50%;top:calc(18px + var(--st));transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--sheet);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);font-family:var(--mono);font-size:12px;white-space:nowrap}
.hudmid .bar{width:70px;height:3px;border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden}
.hudmid .bar i{display:block;height:100%;background:var(--yellow);width:0}
.hudmid em{font-style:normal;color:var(--green)}
.pop{position:fixed;z-index:7;right:calc(70px + var(--sr));top:calc(14px + var(--st));width:220px;background:rgba(30,30,33,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:18px;padding:8px;display:grid;gap:2px}
.pop button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:11px 12px;border-radius:12px;font-size:15px}
.pop button:hover{background:rgba(255,255,255,.06)}
.pop button[aria-pressed="true"]::after{content:"✓";color:var(--yellow)}
.pop hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
.pop.left{left:calc(70px + var(--sl));right:auto}

/* window */
#winView{z-index:4;background:radial-gradient(ellipse at 50% 42%,#1d1d21 0%,#0c0c0e 60%,#050506 100%);display:grid;place-items:center}
.bezel{position:relative;width:min(74vw,340px);aspect-ratio:.72;border-radius:44%/34%;padding:16px;background:linear-gradient(160deg,#2a2a2f,#141416 60%);box-shadow:0 40px 80px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.08),inset 0 -12px 30px rgba(0,0,0,.6);margin-top:-8vh}
.frame{width:100%;height:100%;border-radius:42%/32%;padding:9px;background:linear-gradient(170deg,#f2f0eb,#c9c6bf);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25),inset 0 6px 14px rgba(0,0,0,.35)}
.glass{position:relative;width:100%;height:100%;border-radius:40%/30%;overflow:hidden;background:#000;box-shadow:inset 0 0 18px rgba(0,0,0,.6)}
.glass canvas{position:absolute;inset:0;width:100%;height:100%}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(140deg,rgba(255,255,255,.12),transparent 35%);pointer-events:none}
.shade{position:absolute;left:0;right:0;top:0;height:var(--shade,14%);background:linear-gradient(#e9e6df,#d6d2c9);box-shadow:0 2px 6px rgba(0,0,0,.35);cursor:ns-resize;touch-action:none;z-index:2}
.shade::after{content:"";position:absolute;left:50%;bottom:6px;width:34%;height:5px;transform:translateX(-50%);border-radius:3px;background:rgba(0,0,0,.22)}

/* done & tickets */
#doneView{background:rgba(0,0,0,.55);display:grid;place-items:center;padding:20px}
.donecard{width:min(360px,100%);background:#1c1c1e;border-radius:26px;padding:24px;display:grid;gap:10px;text-align:center;justify-items:center;border:1px solid var(--line)}
.donecard .big{font-family:var(--mono);font-size:42px;font-weight:500}
.badge{font-size:12px;color:#000;background:var(--visited);padding:4px 10px;border-radius:999px;font-weight:600}
.tlist{display:grid;gap:10px}
.mini{position:relative;background:#232326;border-radius:16px;padding:14px 16px;display:grid;gap:6px;overflow:hidden}
.mini .codes{font-family:var(--mono);font-size:24px;font-weight:500;display:flex;gap:10px;align-items:center}
.mini .codes svg{width:14px;height:14px;fill:#8e8e93}
.mini .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mini .meta svg{width:13px;height:13px}
.stamp{position:absolute;right:16px;top:14px;font-size:11px;font-weight:700;letter-spacing:.12em;padding:3px 8px;border:1.5px solid currentColor;border-radius:6px;transform:rotate(-10deg)}
.stamp.landed{color:var(--green)}.stamp.diverted{color:var(--red)}.stamp.flying{color:var(--dim)}
.toast{position:fixed;left:50%;top:calc(70px + var(--st));transform:translateX(-50%);z-index:20;background:rgba(30,30,33,.95);border:1px solid var(--line);padding:10px 16px;border-radius:14px;font-size:14px}
#loading{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#000;color:var(--muted);font-size:14px;transition:opacity .6s}
@media (prefers-reduced-motion:reduce){.ticket.recoil{animation:none}}
</style>
</head>
<body>
<div id="space"></div>
<div id="map"></div>
<div id="loading">지도를 불러오는 중…</div>

<!-- map controls (all screens) -->
<div class="col r" id="mapCtl">
  <button class="rbtn" id="btnLayers" aria-label="지도 스타일"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3 2 8l10 5 10-5-10-5Z"/><path d="m2 13 10 5 10-5"/></svg></button>
</div>
<div class="pop" id="layerPop" hidden>
  <button data-style="light">지도</button>
  <button data-style="dark">테라</button>
  <button data-style="std">표준</button>
  <button data-style="sat">위성 사진</button>
  <hr>
  <button id="tLabels" aria-pressed="true">라벨</button>
  <button id="tTraffic" aria-pressed="true">다른 비행기</button>
</div>

<!-- HOME -->
<div class="greet" id="greet"><h1 id="hello">좋은 오후예요</h1><p>지금 <b id="here">서울/인천</b>에 있어요</p></div>
<div class="sheet" id="home"><div class="in">
  <div class="stats">
    <div><span class="lbl">방문 공항</span><b id="kVisited">1</b></div>
    <div><span class="lbl">비행</span><b id="kFlights">0</b></div>
    <div><span class="lbl">집중 시간</span><b id="kMinutes">0m</b></div>
  </div>
  <div class="legend"><span><i style="background:var(--visited)"></i>가 본 공항</span><span><i style="background:var(--yellow)"></i>안 가 본 공항</span><span><i style="background:#fff"></i>지금 위치</span></div>
  <button class="pill" id="goSelect">여정 시작하기</button>
  <div class="grid2"><button class="pill dark sm" id="goRandom">랜덤 비행</button><button class="pill dark sm" id="goTickets">티켓 모음 <span id="tcount" class="mono" style="color:var(--yellow)"></span></button></div>
</div></div>

<!-- SELECT -->
<div class="sheet" id="select" hidden><div class="in">
  <div class="row sp"><h2 id="selTitle">얼마나 집중할까요?</h2><button class="ghost" id="selBack">닫기</button></div>
  <div class="row sp" style="align-items:flex-end"><span class="tbig" id="tval">2h 00m</span><span class="lbl" id="selFrom"></span></div>
  <div><input type="range" id="tslider" min="30" max="300" step="5" value="120" aria-label="집중 시간"><div class="ticks"><span>30m</span><span>1h</span><span>2h</span><span>3h</span><span>4h</span><span>5h</span></div></div>
  <div id="destPart" style="display:grid;gap:8px">

  document.querySelectorAll('[data-snd]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.snd===kind));
  $('btnSound').classList.toggle('hot',kind!=='off');
  if(snd){try{snd.g.gain.setTargetAtTime(0,audio.currentTime,.3);const old=snd;setTimeout(()=>old.nodes.forEach(n=>{try{n.stop&&n.stop();n.disconnect()}catch(e){}}),900)}catch(e){}snd=null}
  if(kind==='off')return;
  const a=ac(),len=a.sampleRate*4,buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);
  let b0=0,b1=0,b2=0,last=0;
  for(let i=0;i<len;i++){const w=Math.random()*2-1;
    if(kind==='engine'){last=(last+.02*w)/1.02;d[i]=last*3.5}
    else{b0=.99765*b0+w*.099;b1=.963*b1+w*.2965;b2=.57*b2+w*1.0526;d[i]=(b0+b1+b2+w*.1848)*.12}}
  const src=a.createBufferSource();src.buffer=buf;src.loop=true;
  const f=a.createBiquadFilter(),g=a.createGain();g.gain.value=0;
  const nodes=[src];
  if(kind==='engine'){f.type='lowpass';f.frequency.value=520;const o=a.createOscillator();o.frequency.value=92;const og=a.createGain();og.gain.value=.025;o.connect(og).connect(g);o.start();nodes.push(o)}
  if(kind==='rain'){f.type='highpass';f.frequency.value=900}
  if(kind==='waves'){f.type='lowpass';f.frequency.value=700;const l=a.createOscillator();l.frequency.value=.09;const lg=a.createGain();lg.gain.value=.22;l.connect(lg).connect(g.gain);l.start();nodes.push(l)}
  src.connect(f).connect(g).connect(a.destination);src.start();
  g.gain.setTargetAtTime(kind==='engine'?.5:kind==='rain'?.35:.3,a.currentTime,.4);
  snd={g,nodes};
}
$('btnSound').onclick=()=>{$('soundPop').hidden=!$('soundPop').hidden};
document.querySelectorAll('[data-snd]').forEach(b=>b.onclick=()=>{setSound(b.dataset.snd);$('soundPop').hidden=true});

/* ---------- tickets list ---------- */
function renderTickets(){
  const el=$('tlist');
  if(!S.tickets.length){el.innerHTML='<span class="lbl">아직 모은 티켓이 없어요. 첫 비행을 떠나 보세요.</span>';return}
  const ST={landed:'도착',diverted:'회항',flying:'미완료'};
  el.innerHTML=S.tickets.map(t=>{const sc=SCEN.find(s=>s.id===t.scen)||SCEN[0],d=new Date(t.date),to=t.random&&t.status!=='landed'?'???':t.to;
    return `<div class="mini"><span class="stamp ${t.status}">${ST[t.status]||''}</span>
      <div class="codes">${t.from}<svg viewBox="-12 -12 24 24"><path d="${'M'+planePts.map(p=>p.join(',')).join('L')+'Z'}" transform="rotate(90)"/></svg>${to}</div>
      <div class="meta">${AP[t.from]?AP[t.from].n:''} → ${to==='???'?'미공개':AP[t.to].n}</div>
      <div class="meta mono">${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} · ${fmtHM(t.min)} · ${t.seat} · <span style="color:${sc.c};display:inline-flex;gap:4px;align-items:center">${icon(sc)}${sc.n}</span>${t.random?' · 랜덤':''}</div></div>`}).join('');
}
$('goTickets').onclick=()=>show('tickets');$('ticketsBack').onclick=()=>show('home');
